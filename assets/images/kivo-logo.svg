<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="kivoBg" x1="48" y1="48" x2="464" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2B2FD4"/>
      <stop offset="0.55" stop-color="#5B21B6"/>
      <stop offset="1" stop-color="#8B00FF"/>
    </linearGradient>
    <linearGradient id="kivoRing" x1="120" y1="120" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#55EFFF"/>
    </linearGradient>
    <linearGradient id="kivoK" x1="180" y1="150" x2="340" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F7FF"/>
    </linearGradient>
    <filter id="kivoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#kivoBg)"/>

  <!-- Speech bubble ring (open at top-right) -->
  <path
    d="M156 372
       C118 336 98 286 98 232
       C98 148 166 80 250 80
       C300 80 344 100 374 132"
    stroke="url(#kivoRing)"
    stroke-width="28"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M392 300
       C386 340 360 374 320 394
       C300 404 278 408 256 408
       C230 408 206 400 186 386
       L148 420
       L156 372"
    stroke="url(#kivoRing)"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Ring end glow dots -->
  <circle cx="392" cy="300" r="12" fill="#55EFFF" filter="url(#kivoGlow)"/>
  <circle cx="382" cy="128" r="6" fill="#55EFFF" filter="url(#kivoGlow)"/>

  <!-- Sparkle at ring gap -->
  <g filter="url(#kivoGlow)" transform="translate(392 118)">
    <path
      d="M0 -22 L5 -5 L22 0 L5 5 L0 22 L-5 5 L-22 0 L-5 -5 Z"
      fill="#55EFFF"
    />
  </g>

  <!-- Letter K with subtle fold -->
  <path
    d="M188 148
       H236
       V236
       L300 148
       H356
       L268 258
       L356 364
       H300
       L236 280
       V364
       H188
       Z"
    fill="url(#kivoK)"
  />
  <!-- Fold shadow on K arm -->
  <path
    d="M236 236
       L268 258
       L236 280
       Z"
    fill="#C5D4E8"
    opacity="0.55"
  />
</svg>
